# =============================================================
# Dependabot - Chapitre 3 (SCA)
# Detecte les dependances vulnerables (CVE) et ouvre
# automatiquement des Pull Requests de mise a jour.
# (Activer aussi : Settings > Code security > Dependabot alerts)
# =============================================================
version: 2
updates:
  # Dependances Java / Maven (pom.xml)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # Actions utilisees par le pipeline CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
